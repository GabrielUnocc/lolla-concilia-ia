<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Lolla — Conciliação com IA (MVP)</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="app"></div>

  <!-- Configuração local (chave da API). Se faltar, a app avisa e usa a IA simulada. -->

  <!-- Núcleo -->
  <script src="js/core/base.js"></script>

  <script src="js/services/ixc/baseSimulada.js"></script>
  <script src="js/services/ixc/cenarioTeste2.js"></script>

  <script src="js/services/claude/claudeService.js"></script>
  <!-- Processamento: pareamento, privacidade e indicadores -->
  <script src="js/domain/pareamento.js"></script>
  <script src="js/domain/mascaramento.js"></script>
  <script src="js/domain/ofx.js"></script>
  <script src="js/domain/indicadores.js"></script>
  <!-- Ações (ligam interface e serviços) -->
  <script src="js/app/acoes.js"></script>
  <!-- Interface -->
  <script src="js/ui/componentes.js"></script>
  <script src="js/ui/views/conciliacao.js"></script>
