<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Lolla — Modo Análise</title>
  <link rel="stylesheet" href="css/analise.css">
</head>
<body>
  <header class="topo"><div class="topo-in">
    <div class="marca" aria-hidden="true">L</div>
    <div><h1>AR Lolla · Modo Análise</h1><p>Francesinha × extrato OFX × recebimentos do IXC — o código cruza, a IA só interpreta as sobras</p></div>
    <span class="sep"></span>
    <span class="pilula">Processamento local no navegador</span>
  </div></header>

  <main>
    <section class="bloco" id="etapa-arquivos"></section>
    <section class="bloco" id="etapa-banco"></section>
    <section class="bloco" id="etapa-dados"></section>
    <section class="bloco" id="etapa-resultado"></section>
    <section class="bloco" id="etapa-ia"></section>
  </main>

  <noscript><p style="padding:16px">O Modo Análise precisa de JavaScript.</p></noscript>

  <!-- Configuração local opcional (endereço do intermediário). Nunca coloque a chave da API aqui. -->
  <script src="config.js" onerror="void 0"></script>
  <!-- Leitor de PDF (local, sem CDN) -->
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <!-- Núcleo e domínio (mesmos arquivos copiados para extensao/lolla/lib/) -->
  <script src="js/core/base.js"></script>
  <script src="js/domain/pareamento.js"></script>
  <script src="js/domain/mascaramento.js"></script>
  <script src="js/domain/ofx.js"></script>
  <script src="js/domain/analise/normalizacao.js"></script>
  <script src="js/domain/analise/bancos.js"></script>
  <script src="js/domain/analise/bancos/sicoob.js"></script>
  <script src="js/domain/analise/bancos/bradesco.js"></script>
  <script src="js/domain/analise/bancos/bancoDoBrasil.js"></script>
  <script src="js/domain/analise/bancos/sicredi.js"></script>
  <script src="js/domain/analise/bancos/itau.js"></script>
  <script src="js/domain/analise/bancos/santander.js"></script>
  <script src="js/domain/analise/classificacaoOfx.js"></script>
  <script src="js/domain/analise/leitorOfx.js"></script>
  <script src="js/domain/analise/leitorFrancesinha.js"></script>
  <script src="js/domain/analise/planilha.js"></script>
  <script src="js/domain/analise/leitorRecebimentos.js"></script>
  <script src="js/domain/analise/motor.js"></script>
  <script src="js/domain/analise/resultado.js"></script>
  <script src="js/domain/analise/privacidadeIa.js"></script>
  <!-- Serviços -->
  <script src="js/services/pdfTexto.js"></script>
  <script src="js/services/iaIntermediario.js"></script>
  <!-- Interface -->
  <script src="js/ui/analise/componentes.js"></script>
  <script src="js/ui/analise/arquivos.js"></script>
  <script src="js/ui/analise/resultados.js"></script>
  <script src="js/ui/analise/ia.js"></script>
  <script src="js/ui/analise/app.js"></script>
</body>
</html>
